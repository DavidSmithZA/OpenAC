<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quests on the HUD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #F4EBDC;">
  <div style="position: absolute; left: 0; top: 0;">
    <dc-import name="Horizon" trim="bronze" hint-size="1440px,900px"></dc-import>
  </div>

  <!-- tracked quests: a panel the player places anywhere (Edit layout), here on the left -->
  <section aria-label="Quests on screen" style="position: absolute; left: 16px; top: 330px; width: 250px; display: flex; flex-direction: column; gap: 6px; text-shadow: 0 1px 3px rgba(0,0,0,0.9);">
    <div title="Drag to move it (Edit layout)" style="display: flex; align-items: center; gap: 8px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; color: #E9D3AE; cursor: grab;">
      <svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true"><path d="M2 2h.01M8 2h.01M2 6h.01M8 6h.01M2 10h.01M8 10h.01" stroke="#E9D3AE" stroke-width="2.4" stroke-linecap="round"></path></svg>
      <span style="flex: 1;">QUESTS</span>
      <button aria-label="Fold the quest list" style="width: 18px; height: 18px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#E9D3AE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
    </div>
    <sc-for list="{{items}}" as="q" hint-placeholder-count="2">
      <button onClick="{{q.pick}}" title="Open in the journal" style="padding: 6px 8px; border-radius: 4px; border: 1px solid {{q.edge}}; background: linear-gradient(90deg, rgba(0,0,0,0.5), rgba(0,0,0,0.2)); display: flex; flex-direction: column; gap: 2px; cursor: pointer; text-align: left;">
        <span style="font-size: 12px; font-weight: 600;">{{q.name}}</span>
        <span style="font-size: 11px; color: {{q.lineColor}};">{{q.line}}</span>
      </button>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const rows = [
      ['drudge', 'Drudge Raiders of Holtburg', 'You have slain 8 Drudge Raiders.', '#E9D3AE'],
      ['shipment', 'The Lost Shipment', '1h 42m left to finish', '#E0B068']
    ];
    return {
      items: rows.map(([key, name, line, lineColor]) => {
        const on = st.pick === key;
        return { name, line, lineColor, edge: on ? '#E0B068' : 'rgba(201,160,98,0.35)', pick: () => this.setState({ pick: on ? '' : key }) };
      })
    };
  }
}
</script>
</body>
</html>
