<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Using a lockpick: windows step aside</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #F4EBDC;">
  <div style="position: absolute; left: 0; top: 0;">
    <dc-import name="Horizon" trim="bronze" hint-size="1440px,900px"></dc-import>
  </div>

  <!-- the chest in the world, partly behind the inventory -->
  <div style="position: absolute; left: 1086px; top: 520px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
    <svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true"><path d="M2 2l9 9 9-9" fill="none" stroke="#E0B068" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span style="font-size: 13px; font-weight: 600; color: #E0B068; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">Chest</span>
    <svg width="130" height="92" viewBox="0 0 130 92" role="img" aria-label="A wooden chest">
      <path d="M8 34 Q65 4 122 34 L122 44 L8 44 Z" fill="#6B4A2B" stroke="#2A1B0E" stroke-width="2"></path>
      <rect x="8" y="44" width="114" height="44" fill="#7A5532" stroke="#2A1B0E" stroke-width="2"></rect>
      <rect x="8" y="40" width="114" height="8" fill="#4A4A48" stroke="#2A1B0E" stroke-width="1.5"></rect>
      <rect x="56" y="44" width="18" height="22" rx="2" fill="#B0903F" stroke="#2A1B0E" stroke-width="1.5"></rect>
      <circle cx="65" cy="54" r="3" fill="#2A1B0E"></circle>
    </svg>
  </div>

  <!-- the inventory is still there, see-through, and lets the click through -->
  <div style="position: absolute; left: 1024px; top: 226px; opacity: 0.14; pointer-events: none;">
    <dc-import name="Packs" state="browse" hint-size="400px,600px"></dc-import>
  </div>
  <div style="position: absolute; left: 1024px; top: 226px; width: 400px; height: 600px; box-sizing: border-box; border: 1px dashed rgba(224,176,104,0.55); border-radius: 6px; pointer-events: none;"></div>

  <!-- the cursor: target, over something the lockpick can be used on -->
  <div style="position: absolute; left: 1134px; top: 586px; display: flex; align-items: center; gap: 8px; pointer-events: none;">
    <svg width="32" height="32" viewBox="0 0 24 24" role="img" aria-label="Target cursor over a valid target">
      <path d="M12 4a8 8 0 1 0 .01 0z" fill="none" stroke="#14100C" stroke-width="4"></path>
      <path d="M12 0.5v5M12 18.5v5M0.5 12h5M18.5 12h5" stroke="#14100C" stroke-width="3.6" stroke-linecap="round"></path>
      <path d="M12 4a8 8 0 1 0 .01 0z" fill="none" stroke="#E0B068" stroke-width="2"></path>
      <path d="M12 0.5v5M12 18.5v5M0.5 12h5M18.5 12h5" stroke="#E0B068" stroke-width="1.8" stroke-linecap="round"></path>
      <path d="M12 9.2a2.8 2.8 0 1 0 .01 0z" fill="#E0B068" stroke="#14100C" stroke-width="1"></path>
    </svg>
    <span style="padding: 5px 10px; border-radius: 4px; border: 1px solid rgba(201,160,98,0.8); background: rgba(20,16,12,0.92); font-size: 12px; font-weight: 600; white-space: nowrap;">Use Intricate Lockpick on Chest</span>
  </div>

  <!-- what you are doing, above the bars -->
  <div style="position: absolute; left: 50%; bottom: 196px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 12px; border-radius: 999px; border: 1px solid #E0B068; background: rgba(20,16,12,0.9); box-shadow: 0 6px 18px rgba(0,0,0,0.45);">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E0B068" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l8-8M11 13l2-2M13 11h3l2-2-1-1 2-2-1-1-2 2-1-1-2 2v3M15 9l-2 2"></path></svg>
    <span style="font-size: 12.5px;"><span style="font-weight: 700;">Intricate Lockpick</span>: pick what to use it on</span>
    <button style="height: 24px; padding: 0 10px; border-radius: 999px; border: 1px solid rgba(201,160,98,0.6); background: rgba(0,0,0,0.4); font: inherit; font-size: 11.5px; font-weight: 600; color: #E9D3AE; cursor: pointer;">Esc cancels</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
