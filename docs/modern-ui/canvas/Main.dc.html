<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass HUD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6CC4FF}a:hover{color:#A5DBFF}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #EEF2F6; background: linear-gradient(180deg, #1C2636 0%, #3A4C63 38%, #6B7D8F 52%, #3B4733 53%, #232B1F 100%);">

  <!-- world nameplate -->
  <div style="position: absolute; left: 760px; top: 360px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
    <div style="font-size: 13px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">Drudge Ravener</div>
    <div style="width: 90px; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.5);"><div style="width: 68%; height: 100%; border-radius: 2px; background: #F0525A;"></div></div>
    <div style="width: 120px; height: 160px; border: 1.5px dashed rgba(255,255,255,0.35); border-radius: 60px 60px 12px 12px; margin-top: 6px;"></div>
    <div style="width: 150px; height: 30px; border: 2px solid {{accent}}; border-radius: 50%; margin-top: -20px; opacity: 0.8;"></div>
  </div>

  <!-- character chip + buffs -->
  <div style="position: absolute; left: 24px; top: 24px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px; border-radius: 14px; background: rgba(12,15,20,0.58); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.08);">
      <div style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid {{accent}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; background: #26303D;">AV</div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 15px; font-weight: 600;">Aerin Vale</div>
        <div style="font-size: 12px; color: #A9B4C0;">Level 87 · Vitae 95%</div>
      </div>
    </div>
    <div style="display: flex; gap: 6px;">
      <sc-for list="{{buffs}}" as="b" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
          <div style="width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: rgba(12,15,20,0.58); border: 1px solid {{b.ring}};">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{b.ring}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.d}}"></path></svg>
          </div>
          <div style="font-size: 10px; color: #C9D2DC; font-variant-numeric: tabular-nums;">{{b.t}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- target frame -->
  <div style="position: absolute; left: 540px; top: 24px; width: 360px; padding: 12px 16px; box-sizing: border-box; border-radius: 14px; background: rgba(12,15,20,0.58); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div style="font-size: 15px; font-weight: 600;">Drudge Ravener</div>
      <div style="font-size: 12px; color: #FF9AA0;">Hostile · 68%</div>
    </div>
    <div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1);"><div style="width: 68%; height: 100%; border-radius: 3px; background: #F0525A;"></div></div>
    <div style="font-size: 12px; color: #A9B4C0;">Appraised · Level 60 · Weak to fire</div>
  </div>

  <!-- compass + radar -->
  <div style="position: absolute; right: 24px; top: 24px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px;">
    <div style="width: 300px; height: 34px; border-radius: 10px; background: rgba(12,15,20,0.58); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.08); position: relative; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; box-sizing: border-box; font-size: 12px; font-weight: 600; color: #A9B4C0;">
      <span>W</span><span>NW</span><span style="color: #EEF2F6; font-size: 14px;">N</span><span>NE</span><span>E</span>
      <div style="position: absolute; left: 149px; bottom: -1px; width: 2px; height: 8px; background: {{accent}};"></div>
    </div>
    <div style="width: 150px; height: 150px; border-radius: 50%; background: rgba(12,15,20,0.58); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.1); position: relative;">
      <div style="position: absolute; inset: 37px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.08);"></div>
      <div style="position: absolute; left: 72px; top: 70px; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid #EEF2F6; margin-left: -3px;"></div>
      <div style="position: absolute; left: 92px; top: 44px; width: 8px; height: 8px; border-radius: 50%; background: #F0525A;"></div>
      <div style="position: absolute; left: 40px; top: 96px; width: 7px; height: 7px; border-radius: 50%; background: #F0525A;"></div>
      <div style="position: absolute; left: 104px; top: 108px; width: 7px; height: 7px; border-radius: 50%; background: #8BE38F;"></div>
      <div style="position: absolute; left: 58px; top: 34px; width: 7px; height: 7px; border-radius: 2px; background: #F2B544;"></div>
    </div>
    <div style="font-size: 12px; color: #C9D2DC; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">42.1N, 33.6E · Holtburg outskirts</div>
  </div>

  <!-- panel rail -->
  <nav aria-label="Panels" style="position: absolute; right: 24px; top: 300px; display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 14px; background: rgba(12,15,20,0.58); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.08);">
    <sc-for list="{{rail}}" as="r" hint-placeholder-count="7">
      <button aria-label="{{r.label}}" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DDE4EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg>
        <span style="position: absolute; right: 3px; bottom: 2px; font-size: 9px; font-weight: 600; color: #8E9AA7;">{{r.key}}</span>
      </button>
    </sc-for>
  </nav>

  <!-- chat -->
  <div style="position: absolute; left: 24px; bottom: 28px; width: 430px; display: flex; flex-direction: column; gap: 8px; padding: 12px; box-sizing: border-box; border-radius: 14px; background: rgba(12,15,20,0.45); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.06);">
    <div style="display: flex; gap: 4px;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <button style="padding: 4px 10px; border-radius: 999px; border: 0; font-size: 12px; font-weight: 600; background: {{t.bg}}; color: {{t.fg}}; cursor: pointer;">{{t.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.45;">
      <sc-for list="{{chat}}" as="c" hint-placeholder-count="6">
        <div><span style="color: {{c.color}}; font-weight: 600;">{{c.who}}</span> <span style="color: #DDE4EB;">{{c.text}}</span></div>
      </sc-for>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; background: rgba(255,255,255,0.06); font-size: 13px; color: #8E9AA7;">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Chat message</span>
      <input placeholder="Press Enter to chat" style="flex: 1; background: transparent; border: 0; outline: none; color: #EEF2F6; font: inherit;">
    </label>
  </div>

  <!-- vitals + action bar -->
  <div style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <div style="display: flex; gap: 14px;">
      <sc-for list="{{vitals}}" as="v" hint-placeholder-count="3">
        <div style="width: 180px; display: flex; flex-direction: column; gap: 5px;">
          <div style="display: flex; justify-content: space-between; font-size: 12px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">
            <span style="font-weight: 600;">{{v.label}}</span><span style="color: #DDE4EB;">{{v.val}}</span>
          </div>
          <div style="height: 6px; border-radius: 3px; background: rgba(0,0,0,0.45);"><div style="width: {{v.pct}}; height: 100%; border-radius: 3px; background: {{v.color}};"></div></div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 16px; background: rgba(12,15,20,0.58); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.08);">
      <div role="group" aria-label="Combat mode" style="display: flex; flex-direction: column; gap: 2px;">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
          <button style="width: 64px; height: 14px; padding: 0; border: 0; border-radius: 4px; font-size: 9px; font-weight: 700; letter-spacing: 0.06em; background: {{m.bg}}; color: {{m.fg}}; cursor: pointer;">{{m.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 6px;">
        <sc-for list="{{slots}}" as="s" hint-placeholder-count="10">
          <button aria-label="{{s.label}}" style="width: 52px; height: 52px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{s.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg>
            <span style="position: absolute; left: 5px; top: 3px; font-size: 10px; font-weight: 600; color: #8E9AA7;">{{s.key}}</span>
            <span style="position: absolute; left: 0; right: 0; bottom: 0; height: {{s.cd}}; background: rgba(0,0,0,0.55); border-radius: 0 0 9px 9px;"></span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #8E9AA7; gap: 2px; padding: 0 4px;">
        <span>▲</span><span style="font-weight: 600; color: #DDE4EB;">1/4</span><span>▼</span>
      </div>
    </div>
  </div>

  <!-- notifications -->
  <div style="position: absolute; right: 24px; bottom: 28px; width: 260px; display: flex; flex-direction: column; gap: 6px;">
    <sc-for list="{{toasts}}" as="n" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(12,15,20,0.58); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.08); font-size: 13px;">
        <div style="width: 6px; height: 6px; border-radius: 50%; background: {{n.color}}; flex: none;"></div>
        <div style="display: flex; flex-direction: column; gap: 1px;"><span style="font-weight: 600;">{{n.title}}</span><span style="font-size: 12px; color: #A9B4C0;">{{n.sub}}</span></div>
      </div>
    </sc-for>
  </div>

  <!-- XP -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,0.5);"><div style="width: 64%; height: 100%; background: {{accent}};"></div></div>
  <div style="position: absolute; left: 912px; bottom: 12px; padding: 4px 10px; border-radius: 999px; background: {{accent}}; color: #08131C; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;">+18,420 XP</div>
  <div style="position: absolute; left: 24px; bottom: 8px; font-size: 11px; color: #C9D2DC; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(0,0,0,0.8);"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6CC4FF","options":["#6CC4FF","#8BE38F","#F2B544","#C9A2FF"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6CC4FF';
    const P = {
      sword: 'M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2',
      bolt: 'M13 2 4 14h7l-1 8 9-12h-7z',
      shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
      heart: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z',
      drop: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z',
      snow: 'M12 2v20M4 7l16 10M20 7 4 17',
      star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
      eye: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6',
      up: 'M12 19V5M5 12l7-7 7 7',
      flame: 'M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 1.5 1 3 2 3 4',
      bag: 'M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2',
      book: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5',
      user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
      map: 'M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14',
      users: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M16 3a4 4 0 0 1 0 8M22 21a7 7 0 0 0-5-6.7',
      scroll: 'M6 3h12v14a4 4 0 0 1-4 4H6M6 3a3 3 0 0 0-3 3v2h3M10 8h5M10 12h5',
      gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1'
    };
    const war = '#FF8A65', life = '#8BE38F', item = '#F2B544', creat = '#6CC4FF';
    return {
      accent,
      buffs: [
        { d: P.shield, t: '58m', ring: creat }, { d: P.heart, t: '58m', ring: life },
        { d: P.bolt, t: '41m', ring: creat }, { d: P.eye, t: '2h', ring: item },
        { d: P.star, t: '14m', ring: item }, { d: P.snow, t: '0:22', ring: '#F0525A' }
      ],
      rail: [
        { d: P.user, key: 'C', label: 'Character' }, { d: P.bag, key: 'I', label: 'Inventory' },
        { d: P.book, key: 'K', label: 'Spellbook' }, { d: P.scroll, key: 'J', label: 'Quests' },
        { d: P.map, key: 'M', label: 'Map' }, { d: P.users, key: 'O', label: 'Social' },
        { d: P.gear, key: 'Esc', label: 'Options' }
      ],
      tabs: [
        { label: 'All', bg: 'rgba(255,255,255,0.14)', fg: '#EEF2F6' },
        { label: 'General', bg: 'transparent', fg: '#A9B4C0' },
        { label: 'Trade', bg: 'transparent', fg: '#A9B4C0' },
        { label: 'Fellow', bg: 'transparent', fg: '#A9B4C0' },
        { label: 'Tells', bg: 'transparent', fg: '#A9B4C0' }
      ],
      chat: [
        { who: '[Fellow] Mira:', text: 'pulling the next room, stay on the ramp', color: '#8BE38F' },
        { who: '[Trade] Osk:', text: 'WTB Major Coordination, paying well', color: '#F2B544' },
        { who: 'You cast', text: 'Incantation of Flame Bolt on Drudge Ravener', color: '#6CC4FF' },
        { who: 'You hit', text: 'Drudge Ravener for 212 points of fire damage', color: '#FF8A65' },
        { who: 'Drudge Ravener', text: 'misses you', color: '#A9B4C0' },
        { who: '[Tell] Rook:', text: 'got a portal gem for you when you are done', color: '#C9A2FF' }
      ],
      vitals: [
        { label: 'Health', val: '412 / 450', pct: '92%', color: '#F0525A' },
        { label: 'Stamina', val: '298 / 410', pct: '73%', color: '#F2B544' },
        { label: 'Mana', val: '361 / 620', pct: '58%', color: '#4F9DFF' }
      ],
      modes: [
        { label: 'PEACE', bg: 'transparent', fg: '#8E9AA7' },
        { label: 'MELEE', bg: 'transparent', fg: '#8E9AA7' },
        { label: 'MISSILE', bg: 'transparent', fg: '#8E9AA7' },
        { label: 'MAGIC', bg: accent, fg: '#08131C' }
      ],
      slots: [
        { key: '1', d: P.flame, color: war, cd: '0%', label: 'Flame Bolt' },
        { key: '2', d: P.bolt, color: war, cd: '60%', label: 'Lightning Bolt' },
        { key: '3', d: P.snow, color: war, cd: '0%', label: 'Frost Streak' },
        { key: '4', d: P.heart, color: life, cd: '0%', label: 'Heal Self' },
        { key: '5', d: P.drop, color: life, cd: '0%', label: 'Revitalize' },
        { key: '6', d: P.shield, color: creat, cd: '0%', label: 'Armor Self' },
        { key: '7', d: P.eye, color: creat, cd: '0%', label: 'Vulnerability' },
        { key: '8', d: P.drop, color: '#F0525A', cd: '25%', label: 'Health Potion' },
        { key: '9', d: P.drop, color: '#4F9DFF', cd: '0%', label: 'Mana Potion' },
        { key: '0', d: P.up, color: item, cd: '0%', label: 'Lifestone Recall' }
      ],
      toasts: [
        { title: 'Level 87 · 64%', sub: '1,204,880 XP to level 88', color: accent },
        { title: 'Picked up 312 Pyreals', sub: 'Burden 61%', color: '#F2B544' },
        { title: 'Quest updated', sub: 'Drudge Hideout: 7 of 10 slain', color: '#8BE38F' }
      ]
    };
  }
}
</script>
</body>
</html>
