<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A question over the HUD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden;">
  <div style="position: absolute; left: 0; top: 0;">
    <dc-import name="Horizon" trim="bronze" hint-size="1440px,900px"></dc-import>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(10,8,6,0.35);"></div>
  <div style="position: absolute; left: 510px; top: 280px;">
    <dc-import name="Dialog" kind="craft" hint-size="420px,300px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
