<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat in game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif;">
  <div style="position: absolute; left: 0; top: 0;">
    <dc-import name="Horizon" trim="bronze" chat="none" hint-size="1440px,900px"></dc-import>
  </div>
  <div style="position: absolute; left: 0; top: 460px;">
    <dc-import name="Chat" state="active" backdrop="off" hint-size="560px,440px"></dc-import>
  </div>
  <div style="position: absolute; left: 1044px; top: 440px;">
    <dc-import name="ChatFloat" kind="combat" backdrop="off" hint-size="380px,300px"></dc-import>
  </div>
  <div role="status" style="position: absolute; left: 0; right: 0; top: 96px; display: flex; justify-content: center; pointer-events: none;">
    <span style="font-size: 13px; font-weight: 600; color: #F0CC8A; text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 10px rgba(0,0,0,0.5);">Drudge Ravener is out of range.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
