<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
button:disabled{opacity:0.45;cursor:default}
@keyframes dlg-spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div role="{{role}}" aria-label="{{d.title}}" style="width: {{width}}; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #F4EBDC; background: rgba(24,19,14,0.97); backdrop-filter: blur(14px); border: 1px solid {{d.edge}}; border-radius: 6px; box-shadow: 0 18px 50px rgba(0,0,0,0.6); overflow: hidden;">

  <!-- head -->
  <div style="padding: 16px 18px 0; display: flex; align-items: center; gap: 10px;">
    <sc-if value="{{d.hasIcon}}" hint-placeholder-val="{{true}}">
      <span style="width: 30px; height: 30px; flex: none; border-radius: 50%; background: {{d.iconBg}}; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{d.iconFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg>
      </span>
    </sc-if>
    <h2 style="flex: 1; margin: 0; font-size: 15px; font-weight: 700;">{{d.title}}</h2>
    <sc-if value="{{d.queued}}" hint-placeholder-val="{{false}}">
      <span title="Questions are answered one at a time" style="height: 22px; padding: 0 9px; border-radius: 999px; border: 1px solid rgba(201,160,98,0.5); font-size: 11px; font-weight: 700; color: #E9D3AE; display: flex; align-items: center; font-variant-numeric: tabular-nums;">1 of 3</span>
    </sc-if>
  </div>

  <!-- what is being combined -->
  <sc-if value="{{d.isCraft}}" hint-placeholder-val="{{false}}">
    <div style="margin: 14px 18px 0; padding: 10px 12px; border-radius: 4px; background: rgba(0,0,0,0.3); display: flex; align-items: center; gap: 10px;">
      <sc-for list="{{d.parts}}" as="p" hint-placeholder-count="2">
        <span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;">
          <span style="width: 34px; height: 34px; flex: none; border-radius: 4px; background: {{p.tile}}; display: flex; align-items: center; justify-content: center;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{p.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
            <span style="font-size: 12px; font-weight: 600;">{{p.name}}</span>
            <span style="font-size: 10.5px; color: #A89A82;">{{p.sub}}</span>
          </span>
        </span>
        <sc-if value="{{p.arrow}}" hint-placeholder-val="{{true}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E0B068" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </sc-if>
      </sc-for>
    </div>
  </sc-if>

  <!-- the words -->
  <div style="padding: 12px 18px 0; display: flex; flex-direction: column; gap: 8px;">
    <sc-if value="{{d.isWait}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; gap: 12px; padding: 4px 0 2px;">
        <span style="width: 20px; height: 20px; flex: none; box-sizing: border-box; border-radius: 50%; border: 2.5px solid rgba(224,176,104,0.25); border-top-color: #E0B068; animation: dlg-spin 0.9s linear infinite;"></span>
        <span style="font-size: 13px; color: #E9D3AE;">{{d.text}}</span>
      </div>
    </sc-if>
    <sc-if value="{{d.notWait}}" hint-placeholder-val="{{true}}">
      <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #E9D3AE; white-space: pre-line;">{{d.text}}</p>
    </sc-if>
    <sc-if value="{{d.hasNote}}" hint-placeholder-val="{{false}}">
      <p style="margin: 0; font-size: 11.5px; line-height: 1.5; color: {{d.noteColor}};">{{d.note}}</p>
    </sc-if>
    <sc-if value="{{d.isText}}" hint-placeholder-val="{{false}}">
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #C8B89C;">{{d.fieldLabel}}
        <input value="{{d.fieldValue}}" style="height: 34px; box-sizing: border-box; padding: 0 10px; border-radius: 4px; border: 1px solid #E0B068; background: rgba(0,0,0,0.35); color: #F4EBDC; font: inherit; font-size: 13px;">
      </label>
    </sc-if>
    <sc-if value="{{d.isMenu}}" hint-placeholder-val="{{false}}">
      <div role="radiogroup" aria-label="Choices" style="display: flex; flex-direction: column; gap: 2px;">
        <sc-for list="{{d.choices}}" as="c" hint-placeholder-count="3">
          <button role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="height: 34px; padding: 0 10px; border-radius: 4px; border: 1px solid {{c.edge}}; background: {{c.bg}}; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left;">
            <span style="width: 14px; height: 14px; flex: none; box-sizing: border-box; border-radius: 50%; border: 1.5px solid {{c.ring}}; display: flex; align-items: center; justify-content: center;"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{c.dot}};"></span></span>
            <span style="font-size: 12.5px; font-weight: 600;">{{c.label}}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <!-- buttons -->
  <sc-if value="{{d.hasButtons}}" hint-placeholder-val="{{true}}">
    <div style="padding: 16px 18px 16px; display: flex; align-items: center; gap: 8px;">
      <sc-if value="{{d.queued}}" hint-placeholder-val="{{false}}">
        <span style="font-size: 11px; color: #A89A82;">2 more waiting</span>
      </sc-if>
      <span style="flex: 1;"></span>
      <sc-if value="{{d.hasNo}}" hint-placeholder-val="{{true}}">
        <button style="height: 34px; padding: 0 14px; border-radius: 4px; border: 1px solid rgba(201,160,98,0.45); background: transparent; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer;">{{d.no}}<span style="font-size: 10px; color: #A89A82;">Esc</span></button>
      </sc-if>
      <button style="height: 34px; padding: 0 16px; border-radius: 4px; border: 1px solid {{d.yesEdge}}; background: {{d.yesBg}}; color: {{d.yesFg}}; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer;">{{d.yes}}<span style="font-size: 10px; opacity: 0.7;">Enter</span></button>
    </div>
  </sc-if>
  <sc-if value="{{d.noButtons}}" hint-placeholder-val="{{false}}"><div style="height: 16px;"></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["craft","swear","fellow","skill","attribute","aug","yesno","queued","message","wait","text","menu"],"default":"craft"},"$preview":{"width":440,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const kind = this.props.kind || 'craft';
    const GOLD = '#E0B068', RED = '#FF8A8E', BLUE = '#8FB8FF', GREEN = '#7FD08A';
    const I = {
      hammer: 'M14 6l4 4M3 21l9-9M12 12l3-3 4 4-3 3zM14 4l6 6',
      shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
      users: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M16 3a4 4 0 0 1 0 8M22 21a7 7 0 0 0-5-6.7',
      up: 'M12 19V5M5 12l7-7 7 7',
      star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
      q: 'M9 9a3 3 0 1 1 4 2.8c-.6.3-1 .9-1 1.6V15M12 18h.01',
      info: 'M12 8h.01M11 12h1v5h1',
      warn: 'M12 3 2 20h20zM12 10v4M12 17h.01'
    };
    const tint = (c, a) => c.replace('#', '') && ('rgba(' + parseInt(c.slice(1, 3), 16) + ',' + parseInt(c.slice(3, 5), 16) + ',' + parseInt(c.slice(5, 7), 16) + ',' + a + ')');
    const base = { hasIcon: true, isCraft: false, isWait: false, notWait: true, hasNote: false, isText: false, isMenu: false, queued: false, hasButtons: true, noButtons: false, hasNo: true, yes: 'Yes', no: 'No', edge: 'rgba(201,160,98,0.8)', noteColor: '#A89A82' };
    const primary = { yesEdge: GOLD, yesBg: 'rgba(224,176,104,0.9)', yesFg: '#1A140D' };
    const danger = { yesEdge: '#E5484D', yesBg: 'rgba(229,72,77,0.9)', yesFg: '#FFFFFF' };
    const D = (icon, color, extra) => Object.assign({}, base, primary, { icon: I[icon], iconFg: color, iconBg: tint(color, 0.16) }, extra);
    let d;
    if (kind === 'craft') {
      const tile = (c) => 'linear-gradient(160deg, ' + c + '33, rgba(0,0,0,0.5))';
      d = D('hammer', GOLD, Object.assign({}, danger, {
        title: 'Apply Granite?', isCraft: true,
        parts: [
          { name: 'Salvaged Granite', sub: 'workmanship 8', d: 'M4 18l4-10 6 2 6 8z', color: '#B8B0A4', tile: tile('#B8B0A4'), arrow: true },
          { name: 'Mithril Tachi', sub: 'tinkered 3 times', d: 'M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2', color: '#B8C2CC', tile: tile('#B8C2CC'), arrow: false }
        ],
        text: 'You have a 33% chance of successfully applying Granite to the Mithril Tachi. If you fail, the Mithril Tachi will be destroyed. Continue?',
        hasNote: true, note: 'The server’s own words. The pictures are what you combined.', yes: 'Apply', no: 'Cancel'
      }));
    } else if (kind === 'swear') {
      d = D('shield', GOLD, { title: 'Allegiance request', text: 'Lysse wishes to swear allegiance to you.', hasNote: true, note: 'Lysse becomes your vassal, and part of the experience Lysse earns passes up to you.', yes: 'Accept', no: 'Decline' });
    } else if (kind === 'fellow') {
      d = D('users', GREEN, { title: 'Fellowship invitation', text: 'Mira has invited you to join the Ramp Runners fellowship.', yes: 'Join', no: 'Decline' });
    } else if (kind === 'skill') {
      d = D('up', BLUE, { title: 'Change a skill', text: 'Untraining Lockpick returns 6 skill credits and the experience you spent raising it. Continue?', yes: 'Untrain', no: 'Cancel' });
    } else if (kind === 'attribute') {
      d = D('up', BLUE, { title: 'Change an attribute', text: 'Lowering Strength by 10 returns the experience spent on those points. Continue?', yes: 'Lower', no: 'Cancel' });
    } else if (kind === 'aug') {
      d = D('star', '#C9A2FF', Object.assign({}, danger, { title: 'Augmentation', text: 'This augmentation is permanent and costs 4,000,000,000 experience. Continue?', hasNote: true, note: 'It cannot be undone.', noteColor: RED, yes: 'Augment', no: 'Cancel' }));
    } else if (kind === 'yesno') {
      d = D('q', GOLD, { title: 'Arena Master', text: 'Do you wish to enter the arena? You cannot leave until the fight is over.', hasNote: true, note: 'Asked by the person you spoke to.' });
    } else if (kind === 'queued') {
      d = D('users', GREEN, { title: 'Fellowship invitation', text: 'Osk has invited you to join the Night Shift fellowship.', queued: true, yes: 'Join', no: 'Decline' });
    } else if (kind === 'message') {
      d = D('info', BLUE, { title: 'Message', text: 'This portal is sealed. You need the Key of the Old Ramp to pass.', hasNo: false, yes: 'OK' });
    } else if (kind === 'wait') {
      d = D('info', BLUE, { hasIcon: false, title: 'Entering Dereth', isWait: true, notWait: false, text: 'Entering the world…', hasButtons: false, noButtons: true });
    } else if (kind === 'text') {
      d = D('q', GOLD, { title: 'Question', text: 'A question that takes a typed answer: the field below is where it goes.', isText: true, fieldLabel: 'Your answer', fieldValue: 'Ramp Runners', yes: 'OK', no: 'Cancel' });
    } else {
      const sel = st.c !== undefined ? st.c : 1;
      const choices = ['The first choice', 'The second choice', 'The third choice'].map((label, i) => {
        const on = i === sel;
        return { label, on, edge: on ? GOLD : 'rgba(201,160,98,0.2)', bg: on ? 'rgba(224,176,104,0.12)' : 'transparent', ring: on ? GOLD : 'rgba(201,160,98,0.6)', dot: on ? GOLD : 'transparent', pick: () => this.setState({ c: i }) };
      });
      d = D('q', GOLD, { title: 'Question', text: 'A question answered by picking one of a list.', isMenu: true, choices, yes: 'OK', no: 'Cancel' });
    }
    return { d, width: (kind === 'wait' ? 320 : 420) + 'px', role: d.hasButtons ? 'alertdialog' : 'status' };
  }
}
</script>
</body>
</html>
