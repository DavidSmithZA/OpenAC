<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book reader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
button:disabled{opacity:0.45;cursor:default}
</style>
</helmet>
<div style="width: 560px; height: 620px; position: relative; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #F4EBDC; background: rgba(20,16,12,0.94); backdrop-filter: blur(14px); border: 1px solid rgba(201,160,98,0.8); border-radius: 6px; box-shadow: 0 18px 50px rgba(0,0,0,0.55); overflow: hidden; display: flex; flex-direction: column;">

  <!-- header -->
  <div style="flex: none; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 20px; box-sizing: border-box; border-bottom: 1px solid rgba(201,160,98,0.35); background: linear-gradient(180deg, rgba(201,160,98,0.10), rgba(201,160,98,0));">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E0B068" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5"></path></svg>
    <h1 style="flex: 1; margin: 0; font-size: 15px; font-weight: 600;">On the Habits of Drudges</h1>
    <button aria-label="Close the book" style="width: 30px; height: 30px; padding: 0; border-radius: 4px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E9D3AE" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </button>
  </div>

  <!-- page bar -->
  <div style="flex: none; height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 6px; position: relative;">
    <button aria-label="Previous page" style="width: 30px; height: 30px; padding: 0; border-radius: 4px; border: 1px solid rgba(201,160,98,0.45); background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#E9D3AE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <button onClick="{{flipMenu}}" aria-haspopup="listbox" aria-expanded="{{menuOpen}}" style="flex: 1; height: 30px; padding: 0 10px; border-radius: 4px; border: 1px solid {{menuEdge}}; background: rgba(0,0,0,0.35); display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left;">
      <span style="font-size: 12.5px; font-weight: 600;">{{page.label}}</span>
      <span style="flex: 1; font-size: 11.5px; color: #C8B89C;">{{page.by}}</span>
      <span style="font-size: 11px; color: #A89A82; font-variant-numeric: tabular-nums;">of 10</span>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#E9D3AE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <button aria-label="Next page" style="width: 30px; height: 30px; padding: 0; border-radius: 4px; border: 1px solid rgba(201,160,98,0.45); background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#E9D3AE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>

    <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
      <div role="listbox" aria-label="Pages" style="position: absolute; left: 48px; right: 48px; top: 44px; z-index: 2; padding: 4px; border-radius: 6px; border: 1px solid rgba(201,160,98,0.8); background: rgba(24,19,14,0.99); box-shadow: 0 12px 30px rgba(0,0,0,0.6); display: flex; flex-direction: column;">
        <sc-for list="{{menu}}" as="m" hint-placeholder-count="10">
          <button role="option" aria-selected="{{m.on}}" onClick="{{m.pick}}" style="height: 30px; padding: 0 10px; border-radius: 4px; border: 0; background: {{m.bg}}; display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left;">
            <span style="width: 54px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;">{{m.label}}</span>
            <span style="flex: 1; font-size: 11.5px; color: {{m.byColor}};">{{m.by}}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <!-- the page -->
  <div style="flex: 1; min-height: 0; margin: 0 20px; box-sizing: border-box; border-radius: 4px; border: 1px solid {{page.edge}}; background: rgba(244,235,220,0.05); display: flex; flex-direction: column;">
    <sc-if value="{{page.readOnly}}" hint-placeholder-val="{{true}}">
      <div style="flex: 1; padding: 22px 26px; font-size: 14px; line-height: 1.75; color: #F4EBDC; white-space: pre-line;">{{page.text}}</div>
    </sc-if>
    <sc-if value="{{page.writable}}" hint-placeholder-val="{{false}}">
      <label style="flex: 1; display: flex; flex-direction: column;">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Write on this page</span>
        <textarea placeholder="This page is blank. Write here." style="flex: 1; box-sizing: border-box; padding: 22px 26px; resize: none; border: 0; background: transparent; color: #F4EBDC; font: inherit; font-size: 14px; line-height: 1.75; outline: none;">{{page.text}}</textarea>
      </label>
    </sc-if>
  </div>

  <!-- foot -->
  <div style="flex: none; height: 52px; padding: 0 20px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: #A89A82;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A89A82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{page.footIcon}}"></path></svg>
    <span>{{page.foot}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["read","write","menu"],"default":"read"},"$preview":{"width":560,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const mode = this.props.mode || 'read';
    const BY = { 1: 'Corvan', 2: 'Corvan', 3: 'Mira', 4: 'Aerin Vale' };
    const TEXT = {
      1: 'Drudges are cowards alone and brave in numbers. A lone drudge will run for its camp; three will stand and fight.',
      2: 'They favour slings and clubs, and they will steal anything that shines. Keep your pyreals in a pack, not your belt.',
      3: 'The raiders north-west of Holtburg are led by a chieftain who carries their totem. Kill him first and the rest scatter.',
      4: 'Frost works best. Their hides are thick against blades but they hate the cold.'
    };
    const defPage = mode === 'write' ? 5 : 3;
    const cur = Number(st.page || defPage);
    const menuOpen = st.menu !== undefined ? st.menu : mode === 'menu';
    const menu = [];
    for (let n = 1; n <= 10; n++) {
      const by = BY[n];
      menu.push({ label: 'Page ' + n, by: by ? 'by ' + by : 'blank', byColor: by ? '#C8B89C' : '#A89A82', on: n === cur, bg: n === cur ? 'rgba(224,176,104,0.16)' : 'transparent', pick: () => this.setState({ page: String(n), menu: false }) });
    }
    const by = BY[cur];
    const mine = by === 'Aerin Vale';
    const writable = !by || mine;
    const page = {
      label: 'Page ' + cur, by: by ? 'by ' + by : 'blank',
      text: TEXT[cur] || '', readOnly: !writable, writable,
      edge: writable ? 'rgba(224,176,104,0.6)' : 'rgba(201,160,98,0.25)',
      foot: writable ? (mine ? 'Your page: you can change it. Turning the page or closing the book saves it.' : 'A blank page: what you write is signed with your name. Turning the page or closing saves it.') : 'Written by ' + by + '. Only its writer can change it.',
      footIcon: writable ? 'M4 20h4L19 9l-4-4L4 16zM14 6l4 4' : 'M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4'
    };
    return { page, menu, menuOpen, menuEdge: menuOpen ? '#E0B068' : 'rgba(201,160,98,0.45)', flipMenu: () => this.setState({ menu: !menuOpen }) };
  }
}
</script>
</body>
</html>
