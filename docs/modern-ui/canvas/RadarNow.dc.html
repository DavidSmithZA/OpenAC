<div style="width: 520px; height: 440px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #F4EBDC; background: linear-gradient(180deg, #8FB3C9 0%, #A9C4C2 40%, #6F8A55 100%);">

        <circle cx="107.2" cy="43.2" r="3.5" fill="#FFAB00"></circle>
<circle cx="126.4" cy="65.6" r="3.5" fill="#FFAB00"></circle>
