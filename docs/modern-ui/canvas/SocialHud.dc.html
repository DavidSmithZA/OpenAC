<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fellows on the HUD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #F4EBDC;">
  <div style="position: absolute; left: 0; top: 0;">
    <dc-import name="Horizon" trim="bronze" hint-size="1440px,900px"></dc-import>
  </div>

  <!-- fellows, under the buffs -->
  <section aria-label="Fellowship: Ramp Runners" style="position: absolute; left: 16px; top: 78px; width: 200px; display: flex; flex-direction: column; gap: 4px;">
    <div style="height: 18px; padding: 0 2px; display: flex; align-items: center; gap: 6px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; color: #E9D3AE; text-shadow: 0 1px 3px rgba(0,0,0,0.9);">
      <span style="flex: 1;">RAMP RUNNERS</span><span style="font-variant-numeric: tabular-nums;">5 / 9</span>
    </div>
    <sc-for list="{{fellows}}" as="f" hint-placeholder-count="4">
      <button onClick="{{f.pick}}" aria-label="Select {{f.name}}" aria-pressed="{{f.on}}" style="padding: 5px 8px 6px; border-radius: 4px; border: 1px solid {{f.edge}}; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-align: left;">
        <span style="display: flex; align-items: center; gap: 6px;">
          <sc-if value="{{f.leader}}" hint-placeholder-val="{{false}}">
            <svg role="img" aria-label="Leader" width="12" height="12" viewBox="0 0 24 24" fill="#E0B068" stroke="#E0B068" stroke-width="1.5" stroke-linejoin="round"><path d="M3 18h18l-2-10-5 4-2-6-2 6-5-4z"></path></svg>
          </sc-if>
          <span style="flex: 1; font-size: 12px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.8);">{{f.name}}</span>
          <span style="font-size: 10.5px; color: #C8B89C; font-variant-numeric: tabular-nums;">{{f.level}}</span>
        </span>
        <span style="height: 7px; border-radius: 2px; background: rgba(0,0,0,0.6); overflow: hidden;"><span style="display: block; width: {{f.hp}}; height: 100%; background: {{f.hpColor}};"></span></span>
        <span style="display: grid; grid-template-columns: 1fr 1fr; gap: 3px;">
          <span style="height: 3px; border-radius: 2px; background: rgba(0,0,0,0.6); overflow: hidden;"><span style="display: block; width: {{f.st}}; height: 100%; background: #B88A1E;"></span></span>
          <span style="height: 3px; border-radius: 2px; background: rgba(0,0,0,0.6); overflow: hidden;"><span style="display: block; width: {{f.mp}}; height: 100%; background: #2F64C2;"></span></span>
        </span>
      </button>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const pick = st.pick || '';
    const rows = [
      ['mira', 'Mira', '201', 100, 77, 68, true],
      ['osk', 'Osk', '126', 100, 91, 100, false],
      ['hask', 'Hask', '98', 36, 100, 60, false],
      ['wren', 'Wren', '31', 100, 43, 100, false]
    ];
    return {
      fellows: rows.map(([key, name, level, hp, stam, mana, leader]) => {
        const on = key === pick;
        const low = hp < 40;
        return { name, level, leader, on, hp: hp + '%', st: stam + '%', mp: mana + '%',
          hpColor: low ? '#E5484D' : '#B8323A',
          edge: on ? '#E0B068' : low ? 'rgba(229,72,77,0.8)' : 'rgba(201,160,98,0.45)',
          pick: () => this.setState({ pick: on ? '' : key }) };
      })
    };
  }
}
</script>
</body>
</html>
