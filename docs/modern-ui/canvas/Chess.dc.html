<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chess window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 800px; height: 560px; position: relative; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #F4EBDC; background: rgba(20,16,12,0.94); backdrop-filter: blur(14px); border: 1px solid rgba(201,160,98,0.8); border-radius: 6px; box-shadow: 0 18px 50px rgba(0,0,0,0.55); overflow: hidden;">

  <!-- header -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 20px; box-sizing: border-box; border-bottom: 1px solid rgba(201,160,98,0.35); background: linear-gradient(180deg, rgba(201,160,98,0.10), rgba(201,160,98,0));">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E0B068" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21h6M8 18h8l-1-6h-6zM9 12l-2-3 2-2-1-3h8l-1 3 2 2-2 3"></path></svg>
    <h1 style="margin: 0; font-size: 15px; font-weight: 600;">Chess</h1>
    <span style="font-size: 11px; color: #A89A82;">Holtburg board</span>
    <span style="flex: 1;"></span>
    <button aria-label="Close" title="Close the window; the game goes on" style="width: 30px; height: 30px; padding: 0; border-radius: 4px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E9D3AE" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </button>
  </div>

  <!-- board -->
  <div style="position: absolute; left: 20px; top: 70px; display: flex; gap: 6px;">
    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{ranks}}" as="r" hint-placeholder-count="8">
        <span style="height: 56px; width: 12px; display: flex; align-items: center; font-size: 10px; color: #A89A82;">{{r}}</span>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div role="grid" aria-label="Board" style="width: 448px; height: 448px; display: grid; grid-template-columns: repeat(8, 56px); border: 1px solid rgba(201,160,98,0.6); border-radius: 3px; overflow: hidden;">
        <sc-for list="{{squares}}" as="q" hint-placeholder-count="64">
          <button role="gridcell" aria-label="{{q.label}}" onClick="{{q.pick}}" style="width: 56px; height: 56px; padding: 0; border: 0; background: {{q.bg}}; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: inset 0 0 0 {{q.ringW}} {{q.ring}};">
            <span style="font-size: 40px; line-height: 1; color: {{q.fg}}; text-shadow: {{q.shadow}}; font-family: 'Segoe UI Symbol', 'Noto Sans Symbols 2', 'DejaVu Sans', serif;">{{q.glyph}}</span>
            <sc-if value="{{q.dot}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; width: 14px; height: 14px; border-radius: 50%; background: rgba(26,20,13,0.45);"></span>
            </sc-if>
          </button>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(8, 56px); font-size: 10px; color: #A89A82; text-align: center;">
        <sc-for list="{{files}}" as="f" hint-placeholder-count="8"><span>{{f}}</span></sc-for>
      </div>
    </div>
  </div>

  <!-- side -->
  <div style="position: absolute; left: 500px; right: 20px; top: 70px; bottom: 20px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{players}}" as="p" hint-placeholder-count="2">
      <div style="height: 44px; padding: 0 12px; border-radius: 4px; border: 1px solid {{p.edge}}; background: {{p.bg}}; display: flex; align-items: center; gap: 10px;">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: {{p.disc}}; box-shadow: 0 0 0 1px rgba(201,160,98,0.6);"></span>
        <span style="flex: 1; font-size: 13px; font-weight: 600;">{{p.name}}</span>
        <span style="font-size: 11px; font-weight: 700; color: {{p.turnFg}};">{{p.turn}}</span>
      </div>
    </sc-for>
    <div role="status" style="padding: 10px 12px; border-radius: 4px; background: rgba(224,176,104,0.10); border: 1px solid rgba(224,176,104,0.45); font-size: 12.5px; line-height: 1.5;">{{status}}</div>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; color: #C8B89C;">
      <span>MOVES</span><span style="flex: 1; height: 1px; background: rgba(201,160,98,0.22);"></span>
      <span title="Not in the original client" style="padding: 1px 6px; border-radius: 999px; border: 1px solid rgba(201,160,98,0.5); font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em; color: #E0B068;">OPENAC</span>
    </div>
    <div style="flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 24px 1fr 1fr; row-gap: 4px; align-content: start; font-size: 12px; font-variant-numeric: tabular-nums;">
      <sc-for list="{{moves}}" as="m" hint-placeholder-count="6">
        <span style="color: #A89A82;">{{m.n}}.</span><span>{{m.w}}</span><span style="color: {{m.bFg}}; font-weight: {{m.bW}};">{{m.b}}</span>
      </sc-for>
    </div>

    <div style="display: flex; gap: 8px;">
      <button title="Offers Osk a stalemate" style="flex: 1; height: 36px; border-radius: 4px; border: 1px solid rgba(201,160,98,0.6); background: rgba(0,0,0,0.35); font-size: 12px; font-weight: 600; cursor: pointer;">Offer stalemate</button>
      <button onClick="{{askResign}}" style="flex: 1; height: 36px; border-radius: 4px; border: 1px solid rgba(255,138,142,0.5); background: rgba(229,72,77,0.10); color: #FF8A8E; font-size: 12px; font-weight: 600; cursor: pointer;">Resign…</button>
    </div>
  </div>

  <sc-if value="{{resigning}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(10,8,6,0.6); display: flex; align-items: center; justify-content: center;">
      <div role="alertdialog" aria-label="Resign the game?" style="width: 360px; box-sizing: border-box; padding: 18px; border-radius: 6px; border: 1px solid rgba(201,160,98,0.8); background: rgba(24,19,14,0.99); box-shadow: 0 16px 40px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 10px;">
        <h2 style="margin: 0; font-size: 15px; font-weight: 700;">Resign the game?</h2>
        <p style="margin: 0; font-size: 12.5px; line-height: 1.55; color: #E9D3AE;">Osk wins the game.</p>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px;">
          <button onClick="{{keepPlaying}}" style="height: 34px; padding: 0 14px; border-radius: 4px; border: 1px solid rgba(201,160,98,0.45); background: transparent; font-size: 12px; font-weight: 600; cursor: pointer;">Keep playing</button>
          <button style="height: 34px; padding: 0 16px; border-radius: 4px; border: 1px solid #E5484D; background: rgba(229,72,77,0.9); color: #FFFFFF; font-size: 12px; font-weight: 700; cursor: pointer;">Resign</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["move","resign"],"default":"move"},"$preview":{"width":800,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const resigning = st.resign !== undefined ? st.resign : this.props.state === 'resign';
    const VS = '︎';
    const G = { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞', P: '♟' };
    // board from White's side: rank 8 first
    const rows = [
      'r.bq.rk.',
      'ppp..ppp',
      '..np.n..',
      '..b.p...',
      '..B.P...',
      '..NP.N..',
      'PPP..PPP',
      'R.BQ.RK.'
    ];
    const FILES = 'abcdefgh';
    const sel = st.sel !== undefined ? st.sel : 'f3';
    const knightMoves = { f3: ['g5', 'h4', 'd4', 'd2', 'e1', 'e5'] };
    const targets = knightMoves[sel] || [];
    const lastMove = ['e8', 'g8', 'h8', 'f8'];
    const squares = [];
    rows.forEach((row, ri) => {
      const rank = 8 - ri;
      row.split('').forEach((ch, fi) => {
        const name = FILES[fi] + rank;
        const light = (ri + fi) % 2 === 0;
        const isPiece = ch !== '.';
        const white = isPiece && ch === ch.toUpperCase();
        const on = name === sel;
        const target = targets.includes(name);
        const capture = target && isPiece;
        const last = lastMove.includes(name);
        let bg = light ? '#D9C7A3' : '#8C6A44';
        if (last) bg = light ? '#E3CF8A' : '#A88A4E';
        if (on) bg = '#C9A35A';
        squares.push({
          label: name + (isPiece ? ' ' + (white ? 'white ' : 'black ') + ({ K: 'king', Q: 'queen', R: 'rook', B: 'bishop', N: 'knight', P: 'pawn' })[ch.toUpperCase()] : ''),
          glyph: isPiece ? G[ch.toUpperCase()] + VS : '',
          fg: white ? '#FBF6EC' : '#1A140D',
          shadow: white ? '0 0 1px #1A140D, 0 0 1px #1A140D, 0 1px 2px rgba(0,0,0,0.6)' : '0 0 1px rgba(251,246,236,0.6)',
          bg, dot: target && !capture, ring: capture ? 'rgba(229,72,77,0.85)' : 'transparent', ringW: capture ? '4px' : '0',
          pick: () => this.setState({ sel: on ? '' : name })
        });
      });
    });
    const moves = [['e4', 'e5'], ['Nf3', 'Nc6'], ['Bc4', 'Bc5'], ['Nc3', 'Nf6'], ['d3', 'd6'], ['O-O', 'O-O']].map(([w, b], i, all) => ({ n: i + 1, w, b, bFg: i === all.length - 1 ? '#E0B068' : '#F4EBDC', bW: i === all.length - 1 ? '700' : '400' }));
    return {
      squares, ranks: ['8', '7', '6', '5', '4', '3', '2', '1'], files: FILES.split(''),
      players: [
        { name: 'Osk', disc: '#1A140D', turn: '', turnFg: '#A89A82', edge: 'rgba(201,160,98,0.25)', bg: 'rgba(0,0,0,0.22)' },
        { name: 'You', disc: '#FBF6EC', turn: 'YOUR MOVE', turnFg: '#E0B068', edge: '#E0B068', bg: 'rgba(224,176,104,0.12)' }
      ],
      status: sel ? 'Knight picked up. Dots show where it can go; the ringed piece can be taken.' : 'Your move. Click one of your pieces, then a square.',
      moves, resigning,
      askResign: () => this.setState({ resign: true }), keepPlaying: () => this.setState({ resign: false })
    };
  }
}
</script>
</body>
</html>
